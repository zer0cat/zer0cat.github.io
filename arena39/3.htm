<style>
  .card { width: 330px; padding: 6px 10px; box-sizing: border-box;
          background: rgba(10, 20, 40, 0.92); border: 2px solid #c8a000; border-radius: 4px;
          color: #fff; font: 14px/1.35 Arial, sans-serif; white-space: pre-line; }
  .card b { color: #ffcc00; font-weight: normal; }
  .card .price::before { content: ''; display: inline-block; width: 11px; height: 11px;
          margin-right: 4px; background: #e6a800; border: 1px solid #fff3b0; border-radius: 50%; }
  .card .close { float: right; cursor: pointer; color: #ffcc00; }
  .card i { color: #ff0000; font-style: normal; }

  .card .gray { color: #8a8f99; }
  /*#tip { position: absolute; display: none; z-index: 10; }*/
  #tip { position: fixed; display: none; z-index: 10; pointer-events: none; }
  #compare { display: flex; gap: 12px; margin-top: 20px; align-items: stretch; }

  /*table { display: inline-table; margin: 0 12px 12px 0; vertical-align: top;
          border-collapse: separate; border-spacing: 0; background: #1a1a1a; border: 3px solid #555; }*/
		  
	table {
	  border-collapse: separate; border-spacing: 0;
	  background: #1a1a1a; border: 3px solid #555;
	}		  
  caption { color: #0000ff; text-align: center; padding-bottom: 4px; font-weight: bold; }
  td { width: 50px; height: 50px; padding: 5px; background: #000; border: 2px solid #111; }
  td img { display: block; cursor: pointer; border: 2px solid #aaa;
           border-color: #ddd #777 #777 #ddd; }
  td img.selected { outline: 2px solid #ffcc00; }
  
  #shelves {
  display: grid;
  grid-template-columns: repeat(4, max-content);  /* 4 таблицы в ряд */
  gap: 12px;                                      /* расстояние между таблицами */
  align-items: start;                             /* чтобы не растягивались по высоте */
  }

html, body {
  cursor: url('w3_human.cur'), auto;
}
html { overflow-y: scroll; }
</style>
<h4>Кликнуть на иконку для сравнения (не более 5 предметов одновременно)</h4><br><br>
<div id="shelves"></div>

<div id="tip" class="card"></div>
<div id="compare"></div>

<script src="jquery-3.7.1.min.js"></script>
<script src="items.js"></script>

<script>
function cardHtml(it) {
  var c = it.color;
  // {{ ... }} в тексте превращается в цветной кусок (или просто пропадает, если цвета нет)
  var paint = function (s) {
    return c ? s.replace(/\{\{/g, '<span style="color:' + c + '">').replace(/\}\}/g, '</span>')
             : s.replace(/\{\{|\}\}/g, '');
  };
  var h = '<b' + (c ? ' style="color:' + c + '"' : '') + '>' + it.name + '</b>\n' +
          '<b class="price">' + it.price + '</b>\n' + paint(it.text);
  if (it.req && it.req.length) {
    h += '\n\n<b>Требуется:\n' + it.req.map(function (r) {
      return r === 'или' ? 'или' : '- ' + r;
    }).join('\n') + '</b>';
  }
  if (it.note)    h += '\n<span class="gray">' + it.note + '</span>';
  if (it.nostack) h += '\n<span class="gray">Скорость перемещения не складывается!</span>';
  if (it.upgrade) h += '\nКупите рецепт для улучшения I > II';
  return h;
}

  // строим таблицы: по 4 ячейки в ряд, недостающие добиваем пустыми
  groups.forEach(function (g) {
    var $t = $('<table><caption>' + g.title + '</caption></table>');
    var total = Math.ceil(g.items.length / 4) * 4, $tr;
    for (var i = 0; i < total; i++) {
      if (i % 4 === 0) $tr = $('<tr></tr>').appendTo($t);
      var $td = $('<td></td>').appendTo($tr);
      if (g.items[i]) $('<img>').attr('src', g.items[i].icon).data('item', g.items[i]).appendTo($td);
    }
    $('#shelves').append($t);
  });

  // подсказка при наведении
 /* $('#shelves img')
    .on('mouseenter', function () { $('#tip').html(cardHtml($(this).data('item'))).show(); })
    .on('mousemove',  function (e) { $('#tip').css({ left: e.pageX + 15, top: e.pageY + 15 }); })
    .on('mouseleave', function () { $('#tip').hide(); });*/


function moveTip(e) {
  var $t = $('#tip'), w = $t.outerWidth(), h = $t.outerHeight();
  var x = e.clientX + 15, y = e.clientY + 15;
  if (x + w > window.innerWidth)  x = e.clientX - w - 15;   // не влезает справа: ставим слева
  if (y + h > window.innerHeight) y = e.clientY - h - 15;   // не влезает снизу: ставим над курсором
  $t.css({ left: Math.max(5, x), top: Math.max(5, y) });
}

$('#shelves img')
  .on('mouseenter', function (e) {
    $('#tip').html(cardHtml($(this).data('item'))).show();
    moveTip(e);                                              // сразу ставим на место, без мигания
  })
  .on('mousemove', moveTip)
  .on('mouseleave', function () { $('#tip').hide(); });

  // сравнение по клику
  var MAX = 5;
  function removeCard($card) { $card.data('img').removeClass('selected'); $card.remove(); }

  $('#shelves img').on('click', function () {
    var $img = $(this);
    if ($img.hasClass('selected')) {
      removeCard($('#compare .card').filter(function () { return $(this).data('img')[0] === $img[0]; }));
      return;
    }
    if ($('#compare .card').length >= MAX) removeCard($('#compare .card').first());
    var $card = $('<div class="card"></div>')
      .html('<span class="close">X</span>' + cardHtml($img.data('item')))
      .data('img', $img);
    $img.addClass('selected');
    $('#compare').append($card);
  });

  $('#compare').on('click', '.close', function () { removeCard($(this).closest('.card')); });
</script>
